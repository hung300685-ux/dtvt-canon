<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đại Thiên Vũ Trụ — Canon Database</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">🌌 <span>Đại Thiên Vũ Trụ</span><small>Canon Database</small></div>
      <div class="topbar-actions">
        <input id="globalSearch" type="text" placeholder="Tìm kiếm toàn bộ Canon…" />
        <button id="btnExport" class="btn ghost">Xuất JSON</button>
        <button id="btnImport" class="btn ghost">Nhập JSON</button>
        <input id="importFile" type="file" accept="application/json" hidden />
        <button id="btnNew" class="btn primary">+ Mục mới</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" id="sidebar"></nav>

      <main class="content">
        <div id="listView" class="list-view">
          <div class="list-header">
            <h2 id="listTitle">Tất cả</h2>
            <span id="listCount" class="count-badge"></span>
          </div>
          <div id="entryList" class="entry-list"></div>
        </div>
      </main>

      <aside id="detailPanel" class="detail-panel hidden">
        <div class="detail-inner" id="detailInner"></div>
      </aside>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="js/schema.js"></script>
  <script src="js/db.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
